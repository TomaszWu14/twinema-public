name: Security

# Bramka bezpieczeństwa PR → main (ADR-0002, docs/architektura/adr/0002-narzedzia-jakosci-i-bezpieczenstwa.md).
#   blokują:   gitleaks (sekrety), pip-audit (podatne zależności), bandit (SAST, waga ≥ średnia)
#   raportują: semgrep (OWASP, Django), trivy (Dockerfile + obraz) — wyniki jako artefakty;
#              po triażu pierwszych wyników przechodzą na blokujące (decyzja PO, docs/bezpieczenstwo/RYZYKA.md)
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.9.0
      - name: Zależności runtime bez znanych podatności
        run: pip-audit -r requirements.txt --desc

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install bandit==1.8.6
      - name: SAST — blokuje ustalenia o wadze i pewności co najmniej średniej
        run: |
          bandit -r web tools -x '*/tests/*,*/migrations/*' -f json -o bandit.json || true
          bandit -r web tools -x '*/tests/*,*/migrations/*' --severity-level medium --confidence-level medium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit
          path: bandit.json

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - name: SAST — reguły OWASP Top 10 i Django (raport)
        run: semgrep scan --config p/owasp-top-ten --config p/django --sarif --output semgrep.sarif --metrics off || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif

  trivy:
    # Obraz trivy przypięty wersją (akcja trivy-action pod tagiem 0.28.0 nie jest już dostępna).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v4
      - name: Konfiguracja (Dockerfile) — raport
        run: docker run --rm -v "$PWD:/src" "$TRIVY" config --format table /src | tee trivy-config.txt
      - name: Budowa obrazu
        run: DOCKER_BUILDKIT=1 docker build -t twinema:scan .
      - name: Obraz — podatności wysokie i krytyczne z dostępną poprawką (raport)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table twinema:scan | tee trivy-image.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy
          path: trivy-*.txt
