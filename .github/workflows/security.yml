name: Security

# Bramka bezpieczeństwa PR → main (ADR-0002, docs/architektura/adr/0002-narzedzia-jakosci-i-bezpieczenstwa.md).
#   blokują: gitleaks (sekrety), pip-audit (podatne zależności runtime i dev), bandit (SAST, waga ≥ średnia),
#            semgrep (OWASP, Django), trivy (Dockerfile; obraz: wysokie i krytyczne z poprawką).
#   Triaż i wyjątki (decyzje PO): docs/bezpieczenstwo/TRIAZ_SKANOW.md (US-014).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Nowy push do PR-a anuluje starszy przebieg (main zawsze do końca — od niego zależy deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    # Binarka gitleaks przypięta wersją i sumą sha256 (akcja pobierała najnowszą wersję bez weryfikacji).
    # Fałszywe alarmy: .gitleaksignore (fingerprint + powód).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Sekrety w historii (PR — jego commity; cron/ręcznie — cała historia)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --no-banner)
          if [ -n "$BASE" ]; then args+=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install pip-audit==2.9.0
      - name: Zależności runtime bez znanych podatności
        run: pip-audit -r requirements.txt --desc
      - name: Zależności deweloperskie i CI bez znanych podatności
        run: pip-audit -r requirements-dev.txt --desc

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install bandit==1.8.6
      - name: SAST — blokuje ustalenia o wadze i pewności co najmniej średniej
        run: |
          bandit -r web tools -x '*/tests/*,*/migrations/*' -f json -o bandit.json || true
          bandit -r web tools -x '*/tests/*,*/migrations/*' --severity-level medium --confidence-level medium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit
          path: bandit.json

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # django-no-csrf-token wyłączona decyzją PO: fałszywe alarmy dla długich formularzy;
      # zastępuje ją test core/tests/test_csrf_forms.py (token w każdym formularzu POST).
      - name: SAST — reguły OWASP Top 10 i Django (blokuje)
        run: >-
          semgrep scan --config p/owasp-top-ten --config p/django --metrics off --error
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --sarif --output semgrep.sarif
      - name: Lista ustaleń w logu
        if: always()
        run: >-
          python3 -c "import json; d=json.load(open('semgrep.sarif'));
          [print(r['ruleId'].split('.')[-1], r.get('level'), l['artifactLocation']['uri'], l['region']['startLine'])
          for r in d['runs'][0]['results'] for l in [r['locations'][0]['physicalLocation']]]"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep
          path: semgrep.sarif

  trivy:
    # Obraz trivy przypięty wersją (akcja trivy-action pod tagiem 0.28.0 nie jest już dostępna).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Konfiguracja (Dockerfile) — blokuje
        run: >-
          set -o pipefail;
          docker run --rm -v "$PWD:/src" "$TRIVY" config --exit-code 1 --format table /src
          | tee trivy-config.txt
      - name: Budowa obrazu
        run: DOCKER_BUILDKIT=1 docker build -t twinema:scan .
      - name: Obraz — podatności wysokie i krytyczne z dostępną poprawką (blokuje)
        run: >-
          set -o pipefail;
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" "$TRIVY" image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table
          --secret-config /src/trivy-secret.yaml twinema:scan
          | tee trivy-image.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy
          path: trivy-*.txt
