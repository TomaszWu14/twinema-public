name: Deploy

# Po merge do main: webhook Coolify + smoke na /health/ (czeka na NOWY git SHA).
# Natywny auto-deploy Coolify ma być WYŁĄCZONY — inaczej podwójny deploy.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${COOLIFY_WEBHOOK_URL:-}" ]; then
            echo "::warning::Brak COOLIFY_WEBHOOK_URL — pomijam deploy."; exit 0
          fi
          auth=(); [ -n "${COOLIFY_API_TOKEN:-}" ] && auth=(-H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
          for attempt in 1 2 3; do
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "${auth[@]}" "$COOLIFY_WEBHOOK_URL" || echo 000)
            echo "Próba $attempt → HTTP $code"
            case "$code" in 2*) exit 0 ;; esac
            sleep $((attempt * 3))
          done
          echo "::error::Webhook Coolify nie odpowiada 2xx."; exit 1

      - name: Smoke /health/
        env:
          SMOKE_URL: ${{ secrets.SMOKE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${SMOKE_URL:-}" ]; then echo "::warning::Brak SMOKE_URL — pomijam smoke."; exit 0; fi
          EXPECT="${GITHUB_SHA:0:8}"
          for attempt in $(seq 1 20); do
            body=$(curl -sS -m 10 "$SMOKE_URL" || true)
            ver=$(echo "$body" | sed -n 's/.*"version"[: ]*"\([^"]*\)".*/\1/p')
            echo "Smoke $attempt → version=${ver:-brak} (oczekiwana ${EXPECT})"
            case "$ver" in ${EXPECT}*) echo "Nowa wersja żyje."; exit 0 ;; unknown) exit 0 ;; esac
            sleep 12
          done
          echo "::warning::Smoke nie potwierdził nowej wersji w oknie — sprawdź Coolify."
