name: CI

# Bramka PR → main. `test` = wymagany check w ochronie gałęzi. Merge wyłącznie po akceptacji PO
# (R-09, decyzja PO) — automatyczny merge gałęzi claude/** usunięty.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Runner GitHuba (Postgres jako service container). Po rejestracji runnera na
    # własnym serwerze: zmień na [self-hosted, linux, twinema] i Postgres z .env runnera.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twinema
          POSTGRES_PASSWORD: twinema
          POSTGRES_DB: twinema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twinema" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Testy JS (czyste moduły edytora, sceny i odtwarzaczy)
        run: node --test web/twin/tests/js/*.test.mjs
      - name: Django check + testy (Postgres)
        working-directory: web
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: 'true'
          DJANGO_ALLOWED_HOSTS: '*'
          DATABASE_URL: postgresql://twinema:twinema@127.0.0.1:5432/twinema
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test -v 1 --noinput --parallel 4 --exclude-tag e2e
      - name: Django deploy check
        working-directory: web
        env:
          DJANGO_SECRET_KEY: a-sufficiently-long-random-ci-only-secret-key-0000000000
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: twinema.example.com
          DJANGO_SSL_REDIRECT: 'true'
        run: python manage.py check --deploy --fail-level WARNING

  coverage:
    # Pokrycie: raport całości + próg 80% dla logiki domenowej (Z-28, docs/testy/STRATEGIA_TESTOW.md). SQLite, testy równolegle.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testy pod pomiarem pokrycia
        working-directory: web
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: 'true'
          DJANGO_ALLOWED_HOSTS: '*'
        run: |
          coverage run --rcfile=../pyproject.toml manage.py test --noinput -v 0 --parallel 4 --exclude-tag e2e
          coverage combine --rcfile=../pyproject.toml -q
          coverage report --rcfile=../pyproject.toml | tee coverage.txt
      - name: Próg pokrycia logiki domenowej 80% (Z-28, decyzja PO)
        working-directory: web
        run: >-
          coverage report --rcfile=../pyproject.toml --fail-under=80
          --include='*/scenario/sim/*,*/ml/*,*/twin/layout.py,*/twin/design_*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: web/coverage.txt

  e2e:
    # Testy w przeglądarce (Playwright + Chromium): kluczowe ścieżki i wymuszona CSP bez naruszeń (US-005).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Chromium dla Playwrighta
        run: python -m playwright install --with-deps chromium
      - name: Pliki JS bibliotek (three.js, ECharts) jak w obrazie
        working-directory: web
        run: sh scripts/fetch_vendor.sh
      - name: Testy E2E
        working-directory: web
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: 'true'
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py test --tag e2e --noinput -v 1
