name: Monitor demo

# Co 6 h sprawdza publiczne demo (twinema.twapp.pl): strona główna, logowanie i /health/ muszą
# odpowiadać 200. Awaria → jedno issue „Demo nie odpowiada” z etykietą `demo` (kolejne awarie
# dopisują komentarz); powrót do normy → issue zamknięte. Tylko GITHUB_TOKEN, bez sekretów.
on:
  schedule:
    - cron: '17 */6 * * *'   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://twinema.twapp.pl
  LABEL: demo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          # -L: strona główna przekierowuje gościa na /demo/ — liczy się kod strony docelowej
          for path in / /login/ /health/; do
            code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 \
              --retry 2 --retry-delay 20 --retry-all-errors "$DEMO_URL$path" || echo 000)
            echo "$path → HTTP $code"
            [ "$code" = 200 ] || problems+=("$DEMO_URL$path → HTTP $code")
          done
          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo odpowiada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL nie odpowiada poprawnie ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów odpowiada ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          done
