# Skan sekretów Trivy w obrazie: pomijamy zewnętrzne biblioteki w /opt/venv.
# Fałszywe alarmy z docstringów SDK (np. anthropic 1.14: `{"type": "service_account"}`
# pasuje do reguły gcp-service-account). Podatności paczek w /opt/venv są nadal skanowane;
# nasz kod (/app) jest skanowany na sekrety bez wyjątków.
allow-rules:
  - id: third-party-venv
    description: Zewnętrzne paczki Pythona w wirtualnym środowisku obrazu
    path: ^opt/venv/
